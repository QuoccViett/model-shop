<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - ModelShop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/contact.css">
</head>

<body data-root="../">
    <div id="site-header"></div>

    <main class="container contact-page">
        <div class="contact-breadcrumb">
            <a href="../index.html" title="Trang chủ">Trang chủ</a> / Liên hệ
        </div>

        <section class="contact-card">
            <h1>Liên hệ</h1>
            <div class="contact-grid">
                <div class="contact-left">
                    <p><strong>Trụ sở chính:</strong> 273 An Dương Vương, Phường Chợ Quán</p>
                    <p><strong>Email:</strong> <a href="mailto:admin@example.com">admin@example.com</a></p>
                    <p><strong>Hotline:</strong> <a href="tel:0900000001">0900 00 00 01</a> - <a href="tel:09000000012">0900 00 00 02</a></p>

                    <form class="contact-form" id="contactForm" action="#" method="post" novalidate>
                        <div class="contact-field">
                            <label class="contact-sr-only" for="fullname">Họ tên</label>
                            <input type="text" id="fullname" name="fullname" autocomplete="name" placeholder="Họ tên *">
                            <span class="contact-error" data-error-for="fullname" aria-live="polite"></span>
                        </div>
                        <div class="contact-field">
                            <label class="contact-sr-only" for="email">Email</label>
                            <input type="email" id="email" name="email" autocomplete="email" placeholder="Email *">
                            <span class="contact-error" data-error-for="email" aria-live="polite"></span>
                        </div>
                        <div class="contact-field">
                            <label class="contact-sr-only" for="message">Lời nhắn</label>
                            <textarea id="message" name="message" rows="3" placeholder="Lời nhắn *"></textarea>
                            <span class="contact-error" data-error-for="message" aria-live="polite"></span>
                        </div>
                        <p class="contact-required">*Thông tin bắt buộc</p>
                        <button type="submit" id="contactSubmit">Gửi liên hệ</button>
                    </form>

                    <div class="contact-success" id="contactSuccess" role="status" hidden>
                        <p>Gửi liên hệ thành công. Cảm ơn bạn, shop sẽ phản hồi sớm nhất.</p>
                        <button type="button" id="contactReset">Gửi liên hệ khác</button>
                    </div>
                </div>

                <div class="contact-right">
                    <div class="contact-map">
                        <iframe src="https://www.google.com/maps?q=273+An+D%C6%B0%C6%A1ng+V%C6%B0%C6%A1ng,+Ph%C6%B0%E1%BB%9Dng+Ch%E1%BB%A3+Qu%C3%A1n,+H%E1%BB%93+Ch%C3%AD+Minh&output=embed" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Bản đồ 273 An Dương Vương, Phường Chợ Quán"></iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="../js/data.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/order-status.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/contact.js" defer></script>
</body>

</html>
