<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-ModelShop</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">
    <main class="auth-box">
        <a href="../index.html" class="auth-logo">ModelShop</a>

        <div class="form-card">
            <h1>Đăng nhâp</h1>
            <div id="form-success" class="alert alert-success" hidden>
            </div>
            <div id="form-error" class="alert alert-error" hidden></div>

            <form action="" id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" name="username" id="username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" name="password" id="password" autocomplete="current-password">
                </div>

                <button type="submit" class="btn">Đăng nhập</button>
            </form>

            <p class="form-foot">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
            <p class="form-foot"><a href="../index.html">&larr; Về trang chủ</a></p>
        </div>
    </main>
    <script src="../js/data.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/pages/login.js"></script>
</body>

</html>
