<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products-ModelShop</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root="../">
    <div id="site-header"></div>

    <main class="container">
        <div class="breadcrumb" id="breadcrumb"></div>

        <section class="brand-filter" aria-label="Lọc theo hãng">
            <h2 class="brand-filter-title">Hãng</h2>
            <div class="brand-filter-list" id="brand-filter-list"></div>
        </section>

        <form action="" id="filter-form" class="shop-layout">
            <aside class="filter-box">
                <div class="filter-group">
                    <h3>Loại sản phẩm</h3>
                    <div id="filter-categories"></div>
                </div>
                <div class="filter-group">
                    <h3>Khoảng giá</h3>
                    <div id="filter-prices"></div>
                    <div class="custom-price-range">
                        <div class="custom-price-field">
                            <label for="filter-min-price">Từ</label>
                            <input type="number" id="filter-min-price" name="min" min="0" step="1000" placeholder="Giá thấp nhất">
                            <span>đ</span>
                        </div>
                        <div class="custom-price-field">
                            <label for="filter-max-price">Đến</label>
                            <input type="number" id="filter-max-price" name="max" min="0" step="1000" placeholder="Giá cao nhất">
                            <span>đ</span>
                        </div>
                        <button type="button" class="btn custom-price-apply" id="apply-price-filter">Áp dụng giá</button>
                        <small id="price-filter-error" class="price-filter-error" role="alert" hidden></small>
                    </div>
                </div>
                <div class="filter-group">
                    <label><input type="checkbox" name="sale" value="1" id="filter-sale"> Chỉ sản phẩm đang giảm giá</label>
                </div>
                <a href="products.html" class="filter-clear">Xóa toàn bộ bộ lọc</a>
            </aside>

            <section>
                <div class="list-head">
                    <div>
                        <h1 id="list-title"></h1>
                        <div class="count" id="list-count"></div>
                    </div>
                    <select name="sort" id="sort-select" class="sort-select"></select>
                </div>
                <div class="product-grid" id="product-grid"></div>
                <div id="pagination"></div>
            </section>
        </form>
    </main>

    <div id="site-footer"></div>

    <script src="../js/data.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/products.js"></script>
</body>

</html>
