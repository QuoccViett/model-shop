<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile-ModelShop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/member5.css">
</head>

<body data-root="../">
    <div id="site-header"></div>

    <main class="container">
        <h1 class="page-title">Tài khoản của tôi</h1>
        <p class="account-orders-link"><a href="orders.html">Xem lịch sử đơn hàng của tôi &rsaquo;</a></p>

        <div class="profile-grid">
            <div class="form-card">
                <h2>Thông tin của tôi</h2>
                <div id="info-msg" class="alert" hidden></div>

                <form action="" id="info-form" novalidate>
                    <div class="form-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text" name="username" id="username" readonly>
                        <div class="hint">Tên đăng nhập không thể thay đổi</div>
                    </div>
                    <div class="form-group">
                        <label for="full_name">Họ và tên</label>
                        <input type="text" name="full_name" id="full_name" readonly>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" readonly>
                    </div>
                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="tel" name="phone" id="phone" readonly>
                    </div>
                    <h3>Địa chỉ giao hàng mặc định</h3>
                    <div class="form-group">
                        <label for="address_detail">Số nhà - đường</label>
                        <input type="text" name="address_detail" id="address_detail">
                    </div>
                    <div class="form-group">
                        <label for="ward">Phường / Xã</label>
                        <input type="text" name="ward" id="ward">
                    </div>
                    <div class="form-group">
                        <label for="district">Quận / Huyện</label>
                        <input type="text" name="district" id="district">
                    </div>
                    <div class="form-group">
                        <label for="city">Tỉnh / Thành Phố</label>
                        <input type="text" name="city" id="city">
                    </div>

                    <button type="submit" class="btn">Lưu thay đổi</button>
                </form>
            </div>

            <div class="form-card">
                <h2>Đổi mật khẩu</h2>
                <div id="pw-msg" class="alert" hidden></div>

                <form action="" id="pw-form" novalidate>
                    <div class="form-group">
                        <label for="current">Mật khẩu hiện tại</label>
                        <input type="password" name="current" id="current">
                    </div>
                    <div class="form-group">
                        <label for="new_password">Mật khẩu mới</label>
                        <input type="password" name="new_password" id="new_password">
                    </div>
                    <div class="form-group">
                        <label for="confirm">Nhập lại mật khẩu mới</label>
                        <input type="password" name="confirm" id="confirm">
                    </div>
                    <button type="submit" class="btn">Đổi mật khẩu</button>
                </form>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="../js/data.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/profile.js"></script>
</body>

</html>
