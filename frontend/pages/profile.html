<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile-ModelShop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>

<body data-root="../">
    <div id="site-header"></div>

    <main class="container">
        <h1 class="page-title">Tài khoản của tôi</h1>
        <div class="prof-layout">
            <aside class="prof-sidebar">
                <button type="button" class="prof-nav is-active" data-prof-tab="account">Thông tin tài khoản</button>
                <button type="button" class="prof-nav" data-prof-tab="orders">Đơn hàng của tôi</button>
                <button type="button" class="prof-nav" id="profile-logout">Đăng xuất</button>
            </aside>
            <div class="prof-content">
            <section class="prof-panel is-active" data-prof-panel="account">
            <div class="profile-grid">
            <div class="form-card">
                <h2>Thông tin của tôi</h2>
                <div id="info-msg" class="alert" hidden></div>

                <form action="" id="info-form" novalidate>
                    <div class="form-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text" name="username" id="username" readonly>
                        <div class="hint">Tên đăng nhập không thể thay đổi</div>
                    </div>
                    <div class="form-group">
                        <label for="full_name">Họ và tên</label>
                        <input type="text" name="full_name" id="full_name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="tel" name="phone" id="phone">
                    </div>
                    <h3>Địa chỉ giao hàng mặc định</h3>
                    <div class="form-group">
                        <label for="address_detail">Số nhà - đường</label>
                        <input type="text" name="address_detail" id="address_detail">
                    </div>
                    <div class="form-group">
                        <label for="ward">Phường / Xã</label>
                        <input type="text" name="ward" id="ward">
                    </div>
                    <div class="form-group">
                        <label for="district">Quận / Huyện</label>
                        <input type="text" name="district" id="district">
                    </div>
                    <div class="form-group">
                        <label for="city">Tỉnh / Thành Phố</label>
                        <input type="text" name="city" id="city">
                    </div>

                    <button type="submit" class="btn">Lưu thay đổi</button>
                </form>
            </div>
            <div class="form-card">
                <h2>Đổi mật khẩu</h2>
                <div id="pw-msg" class="alert" hidden></div>

                <form action="" id="pw-form" novalidate>
                    <div class="form-group">
                        <label for="current">Mật khẩu hiện tại</label>
                        <input type="password" name="current" id="current">
                    </div>
                    <div class="form-group">
                        <label for="new_password">Mật khẩu mới</label>
                        <input type="password" name="new_password" id="new_password">
                    </div>
                    <div class="form-group">
                        <label for="confirm">Nhập lại mật khẩu mới</label>
                        <input type="password" name="confirm" id="confirm">
                    </div>
                    <button type="submit" class="btn">Đổi mật khẩu</button>
                </form>
            </div>
            </div>
            </section>
            <section class="prof-panel" data-prof-panel="orders" id="orders-section">
                <div class="form-card prof-orders-card">
                    <div class="prof-orders-head"><h2>Đơn hàng của tôi</h2><div class="prof-order-tabs"><button type="button" class="is-active" data-order-group="all">Tất cả</button><button type="button" data-order-group="processing">Đang xử lý</button><button type="button" data-order-group="shipping">Đang giao</button><button type="button" data-order-group="completed">Hoàn tất</button><button type="button" data-order-group="cancelled">Đã hủy</button></div></div>
                    <div id="orders-list"></div>
                    <div id="order-detail"></div>
                </div>
            </section>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="../js/data.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/order-status.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/profile.js"></script>
</body>

</html>
